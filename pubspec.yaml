name: omnidrop
description: "OmniDrop - fast, end-to-end encrypted P2P file transfer for Android, Windows and Linux."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  desktop_drop: ^0.8.4
  ffi: ^2.2.0
  file_selector: ^1.1.0
  font_awesome_flutter: ^11.0.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
