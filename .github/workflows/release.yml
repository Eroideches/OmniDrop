name: Release

# Builds OmniDrop for Windows, Linux and Android on GitHub-hosted runners.
# Pushing a tag vX.Y.Z publishes a GitHub Release with every installer; a manual run only
# uploads the files as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a test build (artifacts only, no release)
        required: false
        default: 0.0.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6
  NDK_VERSION: 28.2.13676358
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_VERSION:-0.0.0}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building OmniDrop $v"

  core:
    name: Rust core (tests + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Unit and end-to-end tests
        working-directory: native
        run: cargo test --release
      - name: Clippy
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings

  linux:
    name: Linux x64 (.tar.gz, .deb, PKGBUILD)
    needs: [version, core]
    # Oldest supported runner: the binaries then run on any glibc >= 2.35 distribution
    # (Ubuntu 22.04+, Debian 12+, Arch).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev libstdc++-12-dev dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build (Flutter + Rust core through CMake)
        run: >
          flutter build linux --release
          --build-name "${{ needs.version.outputs.version }}"
          --build-number "${{ github.run_number }}"
      - name: Package
        run: scripts/package-linux.sh "${{ needs.version.outputs.version }}" build/linux/x64/release/bundle dist
      - uses: actions/upload-artifact@v7
        with:
          name: omnidrop-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64 (.zip, setup .exe)
    needs: [version, core]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build (Flutter + Rust core through CMake)
        run: >
          flutter build windows --release
          --build-name "${{ needs.version.outputs.version }}"
          --build-number "${{ github.run_number }}"
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: omnidrop-windows
          path: dist/*
          if-no-files-found: error

  android:
    name: Android (APK arm64, arm32, x86_64)
    needs: [version, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Android NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Build the Rust core for every ABI
        run: scripts/build-native.sh android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build split APKs
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64
          --build-name "${{ needs.version.outputs.version }}"
          --build-number "${{ github.run_number }}"
      - name: Collect APKs
        # Release APKs leave CI unsigned: signing keys and passwords never live on GitHub.
        # The maintainer signs them locally (tools/firma-release.sh) and attaches the
        # installable omnidrop-android-*.apk files to the release.
        run: |
          mkdir -p dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk"   dist/omnidrop-android-arm64-unsigned.apk
          cp "$out/app-armeabi-v7a-release.apk" dist/omnidrop-android-arm32-unsigned.apk
          cp "$out/app-x86_64-release.apk"      dist/omnidrop-android-x86_64-unsigned.apk
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: omnidrop-android
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: OmniDrop ${{ needs.version.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Android 8.0+ (most phones) | `omnidrop-android-arm64.apk` |
            | Android 8.0+ (older 32-bit phones) | `omnidrop-android-arm32.apk` |
            | Android x86_64 (emulators, Chromebooks) | `omnidrop-android-x86_64.apk` |
            | Windows 10/11 installer (configures the firewall) | `omnidrop-windows-x64-setup.exe` |
            | Windows 10/11 portable | `omnidrop-windows-x64.zip` |
            | Ubuntu / Debian | `omnidrop-linux-x64.deb` |
            | Any Linux (glibc 2.35+) | `omnidrop-linux-x64.tar.gz` (run `./install.sh`) |
            | Arch Linux | `PKGBUILD` (`makepkg -si`) |

            Android APKs are signed on the maintainer's machine right after the CI build (no
            signing key is stored on GitHub); `*-unsigned.apk` files, if present, are the raw
            CI output. `SHA256SUMS.txt` lists the checksums.
